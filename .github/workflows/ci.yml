name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The build imports the client env module, which refuses to load on
      # nonsense values. These are syntactically valid placeholders — no real
      # project is contacted at build time. Override with repository secrets
      # only if a job actually needs to reach Convex or Clerk.
      VITE_CONVEX_URL: https://placeholder.convex.cloud
      VITE_APP_URL: http://localhost:3000
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and format check
        run: pnpm lint

      - name: Unit and authorization tests
        run: pnpm test

      - name: Build
        run: pnpm build
